# C++: build and test the affected cc_* targets.
#
# See the note at the top of rust-build-lint-test.yml about self-hosted
# runners if this repo moves to GHES.
#
# Note what is NOT in this workflow: formatting and linting. Those live in
# cpp-format-tidy.yml because, unlike Rust, they are not part of the C++ build.

name: C++ Build & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".bazelrc"
      - ".bazelversion"
      - "MODULE.bazel"
      - "**/BUILD.bazel"
      - "**/*.cc"
      - "**/*.h"
      - ".github/workflows/cpp-build-test.yml"

jobs:
  compute-affected-targets:
    runs-on: ubuntu-latest
    outputs:
      build_targets: ${{ steps.build_targets.outputs.targets }}
      test_targets: ${{ steps.test_targets.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bazel

      - name: Determine changed files vs main
        id: changes
        run: |
          set -euo pipefail
          git fetch origin main
          echo "changed_files=$(git diff --name-only origin/main...HEAD | tr '\n' ' ' | xargs)" >>"$GITHUB_OUTPUT"

      - name: Compute affected build targets
        id: build_targets
        run: |
          set -euo pipefail
          source .github/workflow_scripts/compute_affected_targets.sh
          TARGETS=$(bazel query 'kind("cc_(binary|library|test)", //...)' | tr '\n' ' ' | xargs)
          compute_affected_targets "$TARGETS" "${{ steps.changes.outputs.changed_files }}" "targets"

      - name: Compute affected test targets
        id: test_targets
        env:
          ALL_AFFECTED: ${{ steps.build_targets.outputs.targets }}
        run: |
          set -euo pipefail
          if [ -z "$ALL_AFFECTED" ]; then
            echo "targets=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          AFFECTED=$(bazel query "kind('cc_test', set($ALL_AFFECTED))" | tr '\n' ' ' | xargs)
          echo "targets=$AFFECTED" >>"$GITHUB_OUTPUT"

  build-and-test:
    needs: compute-affected-targets
    if: needs.compute-affected-targets.outputs.build_targets != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bazel
      - name: Build affected targets
        env:
          TARGETS: ${{ needs.compute-affected-targets.outputs.build_targets }}
        run: |
          set -euo pipefail
          bazel build $TARGETS
      - name: Test affected targets
        if: needs.compute-affected-targets.outputs.test_targets != ''
        env:
          TARGETS: ${{ needs.compute-affected-targets.outputs.test_targets }}
        run: |
          set -euo pipefail
          bazel test --test_output=errors $TARGETS
